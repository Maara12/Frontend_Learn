<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Registration Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

    <div class="container mt-5 mb-5">
        <div class="card shadow">

            <div class="card-header bg-primary text-white text-center">
                <h2>Job Registration Form</h2>
                <p class="mb-0">Apply for your dream job!</p>
            </div>

            <div class="card-body p-4">
                <form>

                    <div class="mb-3">
                        <label for="fullName" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="fullName" 
                            placeholder="Enter your full name" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" 
                            placeholder="Enter your email" required>
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" id="phone">
                    </div>

                    <div class="mb-3">
                        <label for="jobRole" class="form-label">Select Job Role</label>
                        <select class="form-select" id="jobRole" required>
                            <option value="dotnet">.NET Developer</option>
                            <option value="frontend">Frontend Developer</option>
                            <option value="backend">Backend Developer</option>
                            <option value="designer">UI/UX Designer</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Experience Level</label>

                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="experience" id="fresher"
                                 value="fresher">
                            <label class="form-check-label" for="fresher">Fresher</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="experience" id="experienced" 
                            value="experienced">
                            <label class="form-check-label" for="experienced">Experienced</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Your Skills</label>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="html" value="html">
                            <label class="form-check-label" for="html">HTML</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="css" value="css">
                            <label class="form-check-label" for="css">CSS</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="bootstrap" value="bootstrap">
                            <label class="form-check-label" for="bootstrap">Bootstrap</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="javascript" value="javascript">
                            <label class="form-check-label" for="javascript">JavaScript</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="about" class="form-label">About Yourself</label>
                        <textarea class="form-control" id="about" rows="3"></textarea>
                    </div>

                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="terms" required>
                        <label class="form-check-label" for="terms">I agree to the terms and conditions.</label>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success">Submit Application</button>
                        <button type="reset" class="btn btn-secondary">Reset Form</button>
                    </div>

                </form>
            </div>

        </div>
    </div>

</body>
</html>
