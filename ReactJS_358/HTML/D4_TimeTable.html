<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D4_TimeTable</title>
    <style>
        .tab
        {
            margin: auto;
            margin-top: 50px;
        }
        .tableHead
        {
            color: black;
            background-color: aqua;
        }
        .th_L
        {
            background-color: rgb(201, 255, 114);
        }
        .comm_h
        {
            background-color: rgb(0, 216, 240);
        }
        .colspan_c
        {
            background : rgb(247, 255, 93);
        }
    </style>
</head>
<body>
    <table class="tab" border="2"  cellspacing = "2" cellpadding ="30" >
        <caption><h1> TIME TABLE - CLASS X </h1></caption>
            <tr class="tableHead">
                <th class="comm_h"> DAYS </th>
                <th> 1 </th>
                <th> 2 </th>
                <th> 3 </th>
                <th> 4 </th>
                <th class="th_L" rowspan="6"> LUNCH </th>
                <th> 5 </th>
                <th> 6 </th>
                <th> 7 </th>
                <th> 8 </th>
            </tr>
            </tr>

            <tr>
                <td class="comm_h"> MON </td>
                <td> ENG </td>
                <td> MATH </td>
                <td> SCI </td>
                <td> MATH </td>
                <td> SOC </td>
                <td> TAM </td>
                <td class="colspan_c" colspan="2"> PET </td>
            </tr>
            <tr>
                <td class="comm_h"> TUE </td>
                <td> TAM </td>
                <td> ENG </td>
                <td> MATH </td>
                <td> SCI </td>
                <td> CS </td>
                <td> SOC </td>
                <td class="colspan_c" colspan="2"> CS-LAB </td>
            </tr>
            <tr>
                <td class="comm_h"> WED </td>
                <td> MATH </td>
                <td> CS </td>
                <td class="colspan_c" colspan="2"> SCI-LAB </td>
                <td> TAM </td>
                <td> SOC </td>
                <td> ENG </td>
                <td> MATH </td>
            </tr>
             <tr>
                <td class="comm_h"> THU </td>
                <td> SCI </td>
                <td> ENG </td>
                <td> TAM </td>
                <td> CS </td>
                <td> SOC </td>
                <td> CS </td>
                <td> MATH </td>
                <td> SCI </td>
            </tr>

             <tr>
                <td class="comm_h"> FRI </td>
                <td> ENG </td>
                <td> MATH </td>
                <td> SCI </td>
                <td> SOC </td>
                <td> TAM </td>
                <td> CS </td>
                <td class="colspan_c" colspan="2"> PET </td>

            </tr>


    </table>
    
</body>
</html>
