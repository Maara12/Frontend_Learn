<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <style>
        *{
            box-sizing: border-box;
        }
        /* .content label
        {
            display: block;
        } */
        body
        {
            margin: 0px;
            background: #eb9883;
            background: linear-gradient(90deg, rgba(235, 152, 131, 1) 0%, rgba(112, 200, 255, 1) 100%);
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }   
        form
        {
            width: 500px;
            margin: 200px auto;
            border: 2px solid rgb(0, 0, 0);
            background-color: #eb9883;
            padding: 50px;
            border-radius: 10px;
            box-shadow: -20px 14px 14px 6px;
            outline: 2px solid rgb(118, 47, 0);
            /* justify-items: center; */
        }
        .content
        {
            
            margin: 10px auto;
        }
        button
        {
            padding: 5px 40px;
            background: rgb(112, 243, 255);
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
            letter-spacing: 2px;
        }
        a
        {
            color: rgb(248, 255, 108);
        }
        
        
    </style>
</head>
<body>
    <form>
        <h1>Login Form</h1>
        <div class="content">
            <label>Enter Username : </label>
            <input type="text">
        </div>
        <div class="content">
            <label>Enter Password : </label>
            <input type="password">
        </div>
            <button type="button">Login</button>
        <div class="content">
            <a href="#">Forgot Password</a>
        </div>
    </form>
    
</body>
</html>
